[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "svxylab"
version = "0.0.1"
description = "SVXYLab local daily research: verified data and continuous ledgers"
requires-python = ">=3.12"
dependencies = ["numpy==2.4.3", "pandas==3.0.3", "exchange-calendars==4.13.2", "yfinance==1.7.0", "curl_cffi==0.16.3", "matplotlib==3.11.1", "scikit-learn==1.9.0", "scipy==1.18.1", "threadpoolctl==3.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["synthetic: 合成测试夹具；检查算术和数据解析，不是真实行情或回测"]
